<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Parkland 前台工具箱</title>
  <!-- 先讀本機主題，避免閃一下錯誤 mode -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("parkland-theme");
        if (t !== "dark" && t !== "light") t = "light";
        document.documentElement.setAttribute("data-theme", t);
        window.__PARKLAND_THEME__ = t;
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
        window.__PARKLAND_THEME__ = "light";
      }
    })();
  </script>
  <!-- 深色 = v1.8 青橘；淺色 = v1.11 亮綠 -->
  <link
    id="theme-stylesheet"
    rel="stylesheet"
    href="css/theme-light.css?v=1.19.2"
  />
  <script>
    (function () {
      var t = window.__PARKLAND_THEME__ || "light";
      var link = document.getElementById("theme-stylesheet");
      if (link && t === "dark") {
        link.href = "css/theme-dark.css?v=1.19.2";
      }
    })();
  </script>
  <link rel="stylesheet" href="css/responsive.css?v=1.19.2" />
</head>
<body class="locked">
  <!-- 登入門 -->
  <div id="auth-gate" class="auth-gate" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="auth-card">
      <div class="auth-brand">Parkland <span>前台工具箱</span></div>
      <h1 id="auth-title" class="auth-title">請輸入密碼</h1>
      <form id="auth-form" class="auth-form" autocomplete="current-password">
        <input
          id="auth-password"
          type="password"
          name="password"
          placeholder="密碼"
          required
          autofocus
          spellcheck="false"
        />
        <button type="submit" class="btn btn-primary auth-submit">進入</button>
      </form>
      <p id="auth-error" class="auth-error hidden" role="alert">密碼不正確，請再試</p>
      <div class="auth-theme-row">
        <button type="button" class="theme-toggle" data-theme-toggle title="切換深色／淺色">
          <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
          <span class="theme-toggle-label">深色</span>
        </button>
      </div>
      <p class="auth-meta">by Barry · v1.19.2</p>
    </div>
  </div>

  <div id="app-shell" class="app-shell" hidden>
    <div class="sticky-header">
      <!-- 香港天文台天氣警告條：每 5 分鐘自動更新 -->
      <div
        id="weather-bar"
        class="weather-bar weather-bar--loading"
        role="status"
        aria-live="polite"
        title="資料來源：香港天文台 Open Data"
      >
        <div class="weather-bar-main">
          <span class="weather-bar-icon" aria-hidden="true">⏳</span>
          <span id="weather-bar-text" class="weather-bar-text">正在讀取天文台天氣警告…</span>
        </div>
        <div class="weather-bar-meta">
          <span id="weather-bar-source" class="weather-bar-source">香港天文台</span>
          <span class="weather-bar-sep" aria-hidden="true">·</span>
          <span id="weather-bar-updated" class="weather-bar-updated">—</span>
          <button type="button" id="weather-bar-refresh" class="weather-bar-refresh" title="立即重新整理">重新整理</button>
        </div>
      </div>

      <header class="topbar">
        <div class="brand">Parkland <span>前台工具箱</span></div>
        <div class="search-wrap">
          <input id="search" type="search" placeholder="搜尋：請假、學費、分校、POS…" autocomplete="off" />
        </div>
        <button type="button" class="theme-toggle" data-theme-toggle title="切換深色／淺色">
          <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
          <span class="theme-toggle-label">深色</span>
        </button>
        <div class="meta-right" title="by Barry · Version 1.19.2 · 深色=青橘 v1.8 · 淺色=亮綠 v1.11">
          <span class="meta-by">by Barry</span>
          <span class="meta-dot" aria-hidden="true">·</span>
          <span class="meta-ver">v1.19.2</span>
          <span class="meta-dot" aria-hidden="true">·</span>
          <span class="meta-update">updated 01 Aug 2026</span>
        </div>
      </header>
    </div>

    <div id="file-warning" class="hidden" style="background:#3a2010;color:#ffb020;padding:10px 20px;font-size:13px;border-bottom:1px solid #5a3a10">
      ⚠ 請用網頁網址開啟（GitHub Pages），唔好雙擊本機檔案。複製圖片需要 https。
    </div>

    <nav class="tabs">
      <button type="button" class="tab active" data-tab="templates">回覆模板</button>
      <button type="button" class="tab" data-tab="promos">送樂器推廣</button>
      <button type="button" class="tab" data-tab="fees">學費表</button>
      <button type="button" class="tab" data-tab="rules">守則政策</button>
      <button type="button" class="tab" data-tab="hours">各分校開工收工時間</button>
      <button type="button" class="tab" data-tab="links">常用連結</button>
      <button type="button" class="tab" data-tab="pos">POS 教學</button>
    </nav>

    <main>
      <section id="panel-templates" class="panel active"></section>
      <section id="panel-promos" class="panel"></section>
      <section id="panel-fees" class="panel"></section>
      <section id="panel-rules" class="panel"></section>
      <section id="panel-hours" class="panel"></section>
      <section id="panel-links" class="panel"></section>
      <section id="panel-pos" class="panel"></section>
    </main>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="關閉">×</button>
      <img id="lightbox-img" alt="預覽" />
    </div>

    <div id="toast" class="toast" role="status"></div>

    <footer class="site-footer">
      <span class="footer-note">我的 IP</span>
      <span id="my-ip" class="my-ip" title="呢部電腦而家嘅公網 IP（只顯示俾你睇）">讀取中…</span>
      <button type="button" id="copy-ip" class="copy-ip-btn" hidden>複製</button>
      <span class="footer-sep" aria-hidden="true">·</span>
      <button type="button" id="logout-btn" class="copy-ip-btn">登出</button>
    </footer>
  </div>

  <script src="js/config.js?v=1.19.2"></script>
  <script src="js/branches-data.js?v=1.19.2"></script>
  <script src="js/links-data.js?v=1.19.2"></script>
  <script src="js/app.js?v=1.19.2"></script>
</body>
</html>
